# ai-generated: 30% - assistant drafted the inhibit rule; the routes and receiver URLs follow the laboratory sheet
# P1 reaches the pager. P2 and P3 reach chat and never the pager.
# While CheckoutErrorRate is firing, a P2 or P3 in the same cluster is muted.
# `cluster` is in equal, so a target in another cluster still notifies.
global:
  resolve_timeout: 5m
route:
  receiver: chat
  group_by: [alertname, service]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h
  routes:
    - matchers:
        - 'severity="P1"'
      receiver: pager
    - matchers:
        - 'severity=~"P2|P3"'
      receiver: chat
receivers:
  - name: pager
    webhook_configs:
      - url: http://pager:8080/hook/pager
        send_resolved: true
  - name: chat
    webhook_configs:
      - url: http://pager:8080/hook/chat
        send_resolved: true
inhibit_rules:
  - source_matchers:
      - 'alertname="CheckoutErrorRate"'
      - 'severity="P1"'
    target_matchers:
      - 'severity=~"P2|P3"'
    equal:
      - cluster
